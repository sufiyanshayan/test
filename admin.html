<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Linkatelier — Dashboard</title>
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" onerror="this.remove()">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<style>
:root{
  --ink:#121214; --ink-2:#1b1b1e; --ink-3:#232327; --ink-line:#2d2d31;
  --bone:#faf7f1; --bone-2:#ffffff; --bone-line:#e7e2d8;
  --brass:#b08d57; --brass-dim:#8f7247;
  --forest:#3f6b52; --rust:#b3432b;
  --text-dark:#f3f1ec; --text-dark-dim:#a6a3a0;
  --text-light:#1c1b19; --text-light-dim:#6b6b6f;
  --radius:14px; --radius-sm:9px;
  --font-display:'Fraunces',Georgia,serif;
  --font-body:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
  --shadow:0 10px 30px -12px rgba(0,0,0,.25);
}
[data-theme="dark"]{ --bg:var(--ink); --surface:var(--ink-2); --surface-2:var(--ink-3); --line:var(--ink-line); --text:var(--text-dark); --text-dim:var(--text-dark-dim); }
[data-theme="light"]{ --bg:var(--bone); --surface:var(--bone-2); --surface-2:#f4f0e8; --line:var(--bone-line); --text:var(--text-light); --text-dim:var(--text-light-dim); }
*{box-sizing:border-box; margin:0; padding:0;}
html,body{height:100%;}
body{ font-family:var(--font-body); background:var(--bg); color:var(--text); transition:background .2s ease, color .2s ease; -webkit-font-smoothing:antialiased; }
h1,h2,h3,.display{font-family:var(--font-display); font-weight:600; letter-spacing:-.01em;}
a{color:inherit;} button{font-family:inherit; cursor:pointer;} input,select,textarea{font-family:inherit; font-size:15px;}
::selection{background:var(--brass); color:#fff;} .hidden{display:none !important;} img{max-width:100%; display:block;}

#app{min-height:100vh; display:none;} #app.ready{display:block;}
.shell{display:flex; min-height:100vh;}
.sidebar{ width:250px; flex-shrink:0; background:var(--surface); border-right:1px solid var(--line); padding:22px 16px; display:flex; flex-direction:column; gap:4px; position:sticky; top:0; height:100vh; overflow-y:auto; }
.brand{display:flex; align-items:center; gap:10px; padding:6px 10px 22px;}
.brand .mark{width:30px; height:30px; border-radius:8px; background:var(--brass); display:flex; align-items:center; justify-content:center; color:#fff; font-family:var(--font-display); font-weight:600; font-size:15px;}
.brand .name{font-family:var(--font-display); font-size:18px; font-weight:600;}
.nav-item{ display:flex; align-items:center; gap:11px; padding:10px 12px; border-radius:var(--radius-sm); color:var(--text-dim); font-size:14px; font-weight:500; border:none; background:transparent; width:100%; text-align:left; }
.nav-item svg{width:18px; height:18px; flex-shrink:0;}
.nav-item:hover{background:var(--surface-2); color:var(--text);}
.nav-item.active{background:var(--surface-2); color:var(--brass);}
.sidebar-foot{margin-top:auto; padding-top:14px; border-top:1px solid var(--line);}

.main{flex:1; min-width:0;}
.topbar{ display:flex; align-items:center; justify-content:space-between; padding:16px 26px; border-bottom:1px solid var(--line); position:sticky; top:0; background:var(--bg); z-index:20; }
.topbar h2{font-size:19px;}
.topbar .actions{display:flex; align-items:center; gap:10px;}
.content{padding:26px; max-width:1100px;}
.mobile-menu-btn{display:none;}

.card{background:var(--surface); border:1px solid var(--line); border-radius:var(--radius); padding:20px;}
.grid{display:grid; gap:16px;} .grid-3{grid-template-columns:repeat(3,1fr);} .grid-2{grid-template-columns:repeat(2,1fr);}
.stat{padding:18px;} .stat .num{font-family:var(--font-display); font-size:30px; font-weight:600;} .stat .lbl{font-size:12.5px; color:var(--text-dim); margin-top:4px;}

.btn{ display:inline-flex; align-items:center; justify-content:center; gap:7px; padding:10px 18px; border-radius:999px; border:1px solid transparent; font-size:14px; font-weight:600; transition:transform .12s ease, opacity .15s ease; white-space:nowrap; }
.btn:active{transform:scale(.97);}
.btn-primary{background:var(--brass); color:#fff;} .btn-primary:hover{background:var(--brass-dim);}
.btn-ghost{background:transparent; border-color:var(--line); color:var(--text);} .btn-ghost:hover{background:var(--surface-2);}
.btn-danger{background:transparent; border-color:var(--rust); color:var(--rust);} .btn-danger:hover{background:var(--rust); color:#fff;}
.btn-sm{padding:7px 13px; font-size:13px;}
.btn-icon{width:36px; height:36px; padding:0; border-radius:10px; background:var(--surface-2); border:1px solid var(--line); color:var(--text);}
.btn:disabled{opacity:.5; pointer-events:none;}

.field{margin-bottom:14px;}
.field label{display:block; font-size:13px; font-weight:600; margin-bottom:6px; color:var(--text-dim);}
.field input, .field textarea, .field select{ width:100%; padding:11px 13px; border-radius:10px; border:1px solid var(--line); background:var(--bg); color:var(--text); outline:none; }
.field input:focus, .field textarea:focus, .field select:focus{border-color:var(--brass);}
.field-row{display:flex; gap:12px;} .field-row .field{flex:1;}
.switch{display:inline-flex; align-items:center; gap:9px; cursor:pointer; font-size:14px;}
.switch input{display:none;}
.switch .track{width:38px; height:22px; border-radius:99px; background:var(--line); position:relative; transition:.15s;}
.switch .track::after{content:'';position:absolute; top:2px; left:2px; width:18px; height:18px; border-radius:50%; background:#fff; transition:.15s;}
.switch input:checked + .track{background:var(--brass);} .switch input:checked + .track::after{left:18px;}

.tabs{display:flex; gap:6px; border-bottom:1px solid var(--line); margin-bottom:20px; overflow-x:auto;}
.tab{padding:10px 4px; margin-right:18px; border:none; background:transparent; color:var(--text-dim); font-weight:600; font-size:14px; border-bottom:2px solid transparent; white-space:nowrap;}
.tab.active{color:var(--brass); border-color:var(--brass);}

.link-row{display:flex; gap:12px; align-items:center; background:var(--surface); border:1px solid var(--line); border-radius:var(--radius-sm); padding:12px; margin-bottom:10px; cursor:grab;}
.link-row.dragging{opacity:.4;}
.link-row .handle{color:var(--text-dim); cursor:grab; font-size:18px; user-select:none;}
.link-row .info{flex:1; min-width:0;}
.link-row .info .t{font-weight:600; font-size:14.5px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
.link-row .info .u{font-size:12.5px; color:var(--text-dim); white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
.link-row .stats{font-size:12px; color:var(--text-dim); flex-shrink:0;}
.link-row .row-actions{display:flex; gap:6px; flex-shrink:0;}

.modal-overlay{position:fixed; inset:0; background:rgba(0,0,0,.55); display:flex; align-items:flex-end; justify-content:center; z-index:100; opacity:0; pointer-events:none; transition:opacity .18s;}
.modal-overlay.show{opacity:1; pointer-events:auto;}
.modal{background:var(--surface); border:1px solid var(--line); border-radius:18px 18px 0 0; width:100%; max-width:520px; max-height:88vh; overflow-y:auto; padding:22px; transform:translateY(16px); transition:transform .18s;}
.modal-overlay.show .modal{transform:translateY(0);}
@media(min-width:640px){ .modal-overlay{align-items:center;} .modal{border-radius:18px; margin-bottom:0;} }
.modal-head{display:flex; align-items:center; justify-content:space-between; margin-bottom:16px;}
.modal-head h3{font-size:18px;}

.toast-wrap{position:fixed; bottom:20px; left:50%; transform:translateX(-50%); z-index:200; display:flex; flex-direction:column; gap:8px; align-items:center; width:100%; padding:0 16px;}
.toast{background:var(--ink-2); color:#f3f1ec; padding:11px 18px; border-radius:99px; font-size:13.5px; font-weight:500; box-shadow:var(--shadow); display:flex; align-items:center; gap:8px; max-width:420px;}
.toast.err{background:var(--rust);} .toast.ok{background:var(--forest);}

.skeleton{background:linear-gradient(90deg,var(--surface-2) 25%,var(--line) 50%,var(--surface-2) 75%); background-size:200% 100%; animation:sk 1.3s infinite; border-radius:8px;}
@keyframes sk{0%{background-position:200% 0;}100%{background-position:-200% 0;}}
.empty{text-align:center; padding:50px 20px; color:var(--text-dim);}

.avatar{width:56px; height:56px; border-radius:50%; object-fit:cover; background:var(--surface-2); flex-shrink:0;}
.avatar-fallback{display:flex; align-items:center; justify-content:center; font-family:var(--font-display); font-weight:600; color:#fff; background:var(--brass);}
.upload-tile{width:88px; height:88px; border-radius:16px; border:1.5px dashed var(--line); display:flex; align-items:center; justify-content:center; overflow:hidden; position:relative; cursor:pointer; background:var(--bg); flex-shrink:0;}
.upload-tile img{width:100%; height:100%; object-fit:cover;}
.upload-tile input{position:absolute; inset:0; opacity:0; cursor:pointer;}

.bar-chart{display:flex; align-items:flex-end; gap:6px; height:120px; padding-top:10px;}
.bar-chart .bar{flex:1; background:var(--brass); border-radius:4px 4px 0 0; min-height:2px; position:relative;}
.bar-chart .bar span{position:absolute; top:-18px; left:50%; transform:translateX(-50%); font-size:10.5px; color:var(--text-dim); white-space:nowrap;}

.auth-loading{min-height:100vh; display:flex; align-items:center; justify-content:center; color:var(--text-dim); font-size:14px;}

@media(max-width:860px){
  .grid-3{grid-template-columns:repeat(2,1fr);} .grid-2{grid-template-columns:1fr;}
  .sidebar{position:fixed; left:-260px; top:0; z-index:90; box-shadow:var(--shadow); transition:left .2s; width:240px;}
  .sidebar.open{left:0;}
  .mobile-menu-btn{display:flex; width:36px; height:36px; align-items:center; justify-content:center; border-radius:10px; background:var(--surface-2); border:1px solid var(--line);}
  .sidebar-backdrop{display:none; position:fixed; inset:0; background:rgba(0,0,0,.4); z-index:80;}
  .sidebar-backdrop.show{display:block;}
  .content{padding:18px;} .field-row{flex-direction:column; gap:0;}
}
</style>
</head>
<body data-theme="light">

<div id="checking" class="auth-loading">Checking session…</div>

<div id="app">
  <div class="shell">
    <div class="sidebar-backdrop" id="sidebarBackdrop" onclick="UI.closeSidebar()"></div>
    <aside class="sidebar" id="sidebar">
      <div class="brand"><div class="mark">L</div><div class="name" id="sideBrandName">Linkatelier</div></div>
      <nav id="navCustomer"></nav>
      <div class="sidebar-foot">
        <button class="nav-item" onclick="UI.toggleTheme()">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
          <span data-i18n="toggleTheme">Theme</span>
        </button>
        <button class="nav-item" onclick="UI.toggleLang()">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><path d="M2 12h20M12 2a15 15 0 010 20 15 15 0 010-20"/></svg>
          <span id="langLabel">EN / বাং</span>
        </button>
        <button class="nav-item" onclick="Auth.logout()">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 21H5a2 2 0 01-2-2V5a2 2 0 012-2h4"/><path d="M16 17l5-5-5-5M21 12H9"/></svg>
          <span data-i18n="logout">Log out</span>
        </button>
      </div>
    </aside>

    <div class="main">
      <div class="topbar">
        <div style="display:flex;align-items:center;gap:12px;">
          <button class="mobile-menu-btn" onclick="UI.openSidebar()">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 12h18M3 6h18M3 18h18"/></svg>
          </button>
          <h2 id="pageTitle">Overview</h2>
        </div>
        <div class="actions"><span id="topbarUser" style="font-size:13px;color:var(--text-dim);"></span></div>
      </div>
      <div class="content" id="content"></div>
    </div>
  </div>
</div>

<div class="modal-overlay" id="modalOverlay"><div class="modal" id="modalBody"></div></div>
<div class="toast-wrap" id="toastWrap"></div>

<script>
/* ================================================================
   CONFIG — replace with your Supabase project values
   (must match login.html, master-admin.html, and index.html)
================================================================ */
const SUPABASE_URL = "https://ovzyjnoqnbpwwlqtkwit.supabase.co";
const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im92enlqbm9xbmJwd3dscXRrd2l0Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODA5MzA2MDIsImV4cCI6MjA5NjUwNjYwMn0.UgGC9Bvjeud6v29CjUVrnfRWBuf7jDTxmCOW0u62NRw";
const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

/* ================================================================
   I18N
================================================================ */
const I18N = {
  en:{
    overview:"Overview", profile:"Profile", links:"Links", social:"Social", appearance:"Appearance", analytics:"Analytics", settings:"Settings",
    toggleTheme:"Theme", logout:"Log out",
    totalLinks:"Total links", totalViews:"Total views", totalClicks:"Total clicks",
    save:"Save changes", saved:"Saved", cancel:"Cancel", delete:"Delete", edit:"Edit", add:"Add",
    addLink:"Add link", addSocial:"Add social", noLinksYet:"No links yet", noLinksSub:"Add your first link to get started.",
    title:"Title", url:"URL", description:"Description", visible:"Visible", openNewTab:"Open in new tab",
    confirmDeleteTitle:"Delete this?", confirmDeleteBody:"This can't be undone.", confirm:"Confirm",
    bio:"Bio", location:"Location", website:"Website", phone:"Phone", changePassword:"Change password",
    newPassword:"New password", deleteAccount:"Delete account",
    last7:"7 days", last30:"30 days", last90:"90 days", allTime:"All time", topLinks:"Top links",
    theme:"Theme", light:"Light", dark:"Dark", system:"System",
    profileVisibility:"Public profile", yourPageUrl:"Your page URL", copy:"Copy", displayName:"Display name", username:"Username",
  },
  bn:{
    overview:"ওভারভিউ", profile:"প্রোফাইল", links:"লিঙ্ক", social:"সোশ্যাল", appearance:"অ্যাপিয়ারেন্স", analytics:"অ্যানালিটিক্স", settings:"সেটিংস",
    toggleTheme:"থিম", logout:"লগ আউট",
    totalLinks:"মোট লিঙ্ক", totalViews:"মোট ভিউ", totalClicks:"মোট ক্লিক",
    save:"পরিবর্তন সংরক্ষণ করুন", saved:"সংরক্ষিত হয়েছে", cancel:"বাতিল", delete:"মুছুন", edit:"সম্পাদনা", add:"যোগ করুন",
    addLink:"লিঙ্ক যোগ করুন", addSocial:"সোশ্যাল যোগ করুন", noLinksYet:"এখনো কোনো লিঙ্ক নেই", noLinksSub:"শুরু করতে আপনার প্রথম লিঙ্ক যোগ করুন।",
    title:"শিরোনাম", url:"ইউআরএল", description:"বিবরণ", visible:"দৃশ্যমান", openNewTab:"নতুন ট্যাবে খুলুন",
    confirmDeleteTitle:"এটি মুছবেন?", confirmDeleteBody:"এটি পূর্বাবস্থায় ফেরানো যাবে না।", confirm:"নিশ্চিত করুন",
    bio:"বায়ো", location:"অবস্থান", website:"ওয়েবসাইট", phone:"ফোন", changePassword:"পাসওয়ার্ড পরিবর্তন করুন",
    newPassword:"নতুন পাসওয়ার্ড", deleteAccount:"অ্যাকাউন্ট মুছুন",
    last7:"৭ দিন", last30:"৩০ দিন", last90:"৯০ দিন", allTime:"সর্বমোট", topLinks:"শীর্ষ লিঙ্ক",
    theme:"থিম", light:"হালকা", dark:"গাঢ়", system:"সিস্টেম",
    profileVisibility:"পাবলিক প্রোফাইল", yourPageUrl:"আপনার পেজ ইউআরএল", copy:"কপি", displayName:"প্রদর্শনী নাম", username:"ইউজারনেম",
  }
};
function t(key){ return (I18N[State.lang] && I18N[State.lang][key]) || I18N.en[key] || key; }
function applyI18n(){
  document.querySelectorAll('[data-i18n]').forEach(el=>{ el.textContent = t(el.getAttribute('data-i18n')); });
  document.getElementById('langLabel').textContent = State.lang === 'en' ? 'EN / বাং' : 'বাং / EN';
}

/* ================================================================
   STATE
================================================================ */
const State = {
  user:null, profile:null,
  theme: localStorage.getItem('la_theme') || 'light',
  lang: localStorage.getItem('la_lang') || 'en',
  links:[], socials:[], socialCatalog:[], view:'overview',
};

/* ================================================================
   UI UTILITIES
================================================================ */
const UI = {
  toast(msg, kind){
    const w = document.getElementById('toastWrap');
    const el = document.createElement('div'); el.className = 'toast' + (kind ? ' '+kind : ''); el.textContent = msg;
    w.appendChild(el);
    setTimeout(()=>{ el.style.opacity='0'; el.style.transition='opacity .25s'; setTimeout(()=>el.remove(),250); }, 2600);
  },
  openModal(html){ document.getElementById('modalBody').innerHTML = html; document.getElementById('modalOverlay').classList.add('show'); },
  closeModal(){ document.getElementById('modalOverlay').classList.remove('show'); },
  confirm(title, body, onConfirm){
    UI.openModal(`
      <div class="modal-head"><h3>${escapeHtml(title)}</h3></div>
      <p style="color:var(--text-dim);margin-bottom:20px;font-size:14px;">${escapeHtml(body)}</p>
      <div style="display:flex;gap:10px;justify-content:flex-end;">
        <button class="btn btn-ghost" onclick="UI.closeModal()">${t('cancel')}</button>
        <button class="btn btn-danger" id="confirmBtn">${t('confirm')}</button>
      </div>`);
    document.getElementById('confirmBtn').onclick = ()=>{ UI.closeModal(); onConfirm(); };
  },
  openSidebar(){ document.getElementById('sidebar').classList.add('open'); document.getElementById('sidebarBackdrop').classList.add('show'); },
  closeSidebar(){ document.getElementById('sidebar').classList.remove('open'); document.getElementById('sidebarBackdrop').classList.remove('show'); },
  toggleTheme(){
    State.theme = State.theme === 'dark' ? 'light' : 'dark';
    localStorage.setItem('la_theme', State.theme);
    document.body.setAttribute('data-theme', State.theme);
    if(State.profile) sb.from('la_data').update({data:{...State.profile, theme:State.theme}}).eq('type','profile').eq('owner_id', State.user.id).then(()=>{});
  },
  toggleLang(){ State.lang = State.lang === 'en' ? 'bn' : 'en'; localStorage.setItem('la_lang', State.lang); applyI18n(); Views.renderCustomerView(State.view); },
};
function escapeHtml(s){ return String(s ?? '').replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

/* ================================================================
   AUTH (guarded page — must already be logged in as customer)
================================================================ */
const Auth = {
  async logout(){ await sb.auth.signOut(); window.location.href = 'login.html'; },
  async changePassword(newPassword){ const { error } = await sb.auth.updateUser({ password: newPassword }); if(error) throw error; }
};

/* ================================================================
   NAVIGATION
================================================================ */
const ICONS = {
  overview:'<circle cx="12" cy="12" r="9"/><path d="M12 8v4l3 3"/>',
  profile:'<circle cx="12" cy="8" r="4"/><path d="M4 21c1.5-4 5-6 8-6s6.5 2 8 6"/>',
  links:'<path d="M9 12a4 4 0 004 4h3a4 4 0 000-8h-1"/><path d="M15 12a4 4 0 00-4-4H8a4 4 0 000 8h1"/>',
  social:'<circle cx="6" cy="12" r="2.5"/><circle cx="18" cy="6" r="2.5"/><circle cx="18" cy="18" r="2.5"/><path d="M8.2 10.8L15.8 7.2M8.2 13.2l7.6 3.6"/>',
  appearance:'<circle cx="12" cy="12" r="9"/><path d="M12 3a9 9 0 000 18 4 4 0 000-8 2 2 0 010-4 4 4 0 000-6z"/>',
  analytics:'<path d="M4 20V10M12 20V4M20 20v-7"/>',
  settings:'<circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 00.3 1.9l.1.1a2 2 0 11-2.8 2.8l-.1-.1a1.7 1.7 0 00-1.9-.3 1.7 1.7 0 00-1 1.5V21a2 2 0 11-4 0v-.1a1.7 1.7 0 00-1-1.6 1.7 1.7 0 00-1.9.3l-.1.1a2 2 0 11-2.8-2.8l.1-.1a1.7 1.7 0 00.3-1.9 1.7 1.7 0 00-1.5-1H3a2 2 0 110-4h.1a1.7 1.7 0 001.5-1 1.7 1.7 0 00-.3-1.9l-.1-.1a2 2 0 112.8-2.8l.1.1a1.7 1.7 0 001.9.3H9a1.7 1.7 0 001-1.5V3a2 2 0 114 0v.1a1.7 1.7 0 001 1.5 1.7 1.7 0 001.9-.3l.1-.1a2 2 0 112.8 2.8l-.1.1a1.7 1.7 0 00-.3 1.9V9a1.7 1.7 0 001.5 1h.1a2 2 0 110 4h-.1a1.7 1.7 0 00-1.5 1z"/>',
};
function icon(name){ return `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">${ICONS[name]||''}</svg>`; }
const Nav = {
  build(){
    const items = [['overview','overview'],['profile','profile'],['links','links'],['social','social'],['appearance','appearance'],['analytics','analytics'],['settings','settings']];
    document.getElementById('navCustomer').innerHTML = items.map(([key,label])=>`<button class="nav-item" data-view="${key}" onclick="Views.renderCustomerView('${key}')">${icon(key)}<span>${t(label)}</span></button>`).join('');
  },
  setActive(key){ document.querySelectorAll('#navCustomer .nav-item').forEach(el=>el.classList.toggle('active', el.dataset.view===key)); }
};
</script>
<script>
/* ================================================================
   DATABASE HELPERS
================================================================ */
/* ---- row <-> flat-object mapping (single-table design) ---- */
function rowToLink(row){
  return { id: row.id, visible: row.visible, sort_order: row.sort_order,
    click_count: row.data.click_count||0, title: row.data.title, description: row.data.description,
    url: row.data.url, image_url: row.data.image_url, open_new_tab: row.data.open_new_tab,
    start_date: row.data.start_date, end_date: row.data.end_date };
}
function rowToSocial(row){
  return { id: row.id, visible: row.visible, sort_order: row.sort_order,
    platform: row.data.platform, username: row.data.username, url: row.data.url };
}
function rowToPlatform(row){
  return { key: row.key, display_name: row.data.display_name, icon: row.data.icon, enabled: row.visible, sort_order: row.sort_order };
}

const DB = {
  async myLinks(){
    const { data, error } = await sb.from('la_data').select('*').eq('type','link').eq('owner_id', State.user.id).order('sort_order');
    if(error) throw error; return data.map(rowToLink);
  },
  async mySocials(){
    const { data, error } = await sb.from('la_data').select('*').eq('type','social_link').eq('owner_id', State.user.id).order('sort_order');
    if(error) throw error; return data.map(rowToSocial);
  },
  async socialCatalog(){
    const { data, error } = await sb.from('la_data').select('*').eq('type','social_platform').eq('visible', true).order('sort_order');
    if(error) throw error; return data.map(rowToPlatform);
  },
  async saveProfile(fields){
    const newData = { ...State.profile, ...fields };
    const { error } = await sb.from('la_data').update({ data: newData }).eq('type','profile').eq('owner_id', State.user.id);
    if(error) throw error;
  },
  async createLink(fields){
    const { visible=true, sort_order=0, title, description='', url, image_url=null, open_new_tab=true, start_date=null, end_date=null } = fields;
    const { data, error } = await sb.from('la_data').insert({
      type:'link', owner_id: State.user.id, visible, sort_order,
      data:{ title, description, url, image_url, open_new_tab, start_date, end_date, click_count:0 }
    }).select().single();
    if(error) throw error; return rowToLink(data);
  },
  async updateLink(id, fields){
    const current = State.links.find(l=>l.id===id) || {};
    const merged = { ...current, ...fields };
    const patch = { data:{ title: merged.title, description: merged.description, url: merged.url, image_url: merged.image_url, open_new_tab: merged.open_new_tab, start_date: merged.start_date, end_date: merged.end_date, click_count: merged.click_count||0 } };
    if('visible' in fields) patch.visible = fields.visible;
    if('sort_order' in fields) patch.sort_order = fields.sort_order;
    const { error } = await sb.from('la_data').update(patch).eq('id', id).eq('type','link');
    if(error) throw error;
  },
  async deleteLink(id){ const { error } = await sb.from('la_data').delete().eq('id', id).eq('type','link'); if(error) throw error; },
  async createSocial(fields){
    const { visible=true, sort_order=0, platform, username='', url } = fields;
    const { data, error } = await sb.from('la_data').insert({
      type:'social_link', owner_id: State.user.id, visible, sort_order, data:{ platform, username, url }
    }).select().single();
    if(error) throw error; return rowToSocial(data);
  },
  async updateSocial(id, fields){
    const current = State.socials.find(s=>s.id===id) || {};
    const merged = { ...current, ...fields };
    const patch = { data:{ platform: merged.platform, username: merged.username, url: merged.url } };
    if('visible' in fields) patch.visible = fields.visible;
    if('sort_order' in fields) patch.sort_order = fields.sort_order;
    const { error } = await sb.from('la_data').update(patch).eq('id', id).eq('type','social_link');
    if(error) throw error;
  },
  async deleteSocial(id){ const { error } = await sb.from('la_data').delete().eq('id', id).eq('type','social_link'); if(error) throw error; },
  async myAnalytics(days){
    const since = new Date(Date.now() - days*86400000).toISOString();
    const cutoff = days===0 ? '1970-01-01' : since;
    const [{data:viewRows}, {data:clickRows}] = await Promise.all([
      sb.from('la_data').select('created_at').eq('type','page_view').eq('owner_id', State.user.id).gte('created_at', cutoff),
      sb.from('la_data').select('created_at, ref_id').eq('type','link_click').eq('owner_id', State.user.id).gte('created_at', cutoff),
    ]);
    return {
      views: (viewRows||[]).map(r=>({ viewed_at: r.created_at })),
      clicks: (clickRows||[]).map(r=>({ clicked_at: r.created_at, link_id: r.ref_id })),
    };
  },
  async uploadImage(bucket, file){
    const path = `${State.user.id}/${Date.now()}_${file.name.replace(/[^a-zA-Z0-9._-]/g,'')}`;
    const { error } = await sb.storage.from(bucket).upload(path, file, { upsert:true });
    if(error) throw error;
    const { data } = sb.storage.from(bucket).getPublicUrl(path);
    return data.publicUrl;
  },
};

/* ================================================================
   VIEWS
================================================================ */
const Views = {
  async renderCustomerView(key){
    State.view = key;
    Nav.setActive(key);
    document.getElementById('pageTitle').textContent = t(key);
    UI.closeSidebar();
    const c = document.getElementById('content');
    c.innerHTML = `<div class="skeleton" style="height:200px;border-radius:14px;"></div>`;
    try{
      if(key==='overview') await Views.overview(c);
      else if(key==='profile') await Views.profile(c);
      else if(key==='links') await Views.links(c);
      else if(key==='social') await Views.social(c);
      else if(key==='appearance') await Views.appearance(c);
      else if(key==='analytics') await Views.analytics(c, 7);
      else if(key==='settings') await Views.settings(c);
    }catch(e){ c.innerHTML = `<div class="card empty">${escapeHtml(e.message||'Something went wrong.')}</div>`; }
  },

  async overview(c){
    const [{data:views}, links] = await Promise.all([
      sb.from('la_data').select('id', {count:'exact', head:true}).eq('type','page_view').eq('owner_id', State.user.id),
      DB.myLinks(),
    ]);
    const totalClicks = links.reduce((s,l)=>s+l.click_count,0);
    const pageUrl = `${location.origin}${location.pathname.replace('customer-admin.html','index.html')}?u=${State.profile?.username||''}`;
    c.innerHTML = `
      <div class="grid grid-3" style="margin-bottom:20px;">
        <div class="card stat"><div class="num">${views?.count ?? 0}</div><div class="lbl">${t('totalViews')}</div></div>
        <div class="card stat"><div class="num">${links.length}</div><div class="lbl">${t('totalLinks')}</div></div>
        <div class="card stat"><div class="num">${totalClicks}</div><div class="lbl">${t('totalClicks')}</div></div>
      </div>
      <div class="card">
        <div style="font-weight:600;margin-bottom:8px;">${t('yourPageUrl')}</div>
        <div style="display:flex;gap:8px;flex-wrap:wrap;">
          <input readonly value="${escapeHtml(pageUrl)}" style="flex:1;min-width:220px;padding:10px 13px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--text);">
          <button class="btn btn-ghost btn-sm" onclick="navigator.clipboard.writeText('${escapeHtml(pageUrl)}');UI.toast('${t('copy')}!','ok')">${t('copy')}</button>
          <a class="btn btn-primary btn-sm" href="${escapeHtml(pageUrl)}" target="_blank" rel="noopener">View page</a>
        </div>
      </div>`;
  },

  async profile(c){
    const p = State.profile || {};
    c.innerHTML = `
      <div class="card" style="max-width:560px;">
        <div style="display:flex;gap:16px;align-items:center;margin-bottom:18px;">
          <div class="upload-tile" id="avatarTile">
            ${p.avatar_url ? `<img src="${escapeHtml(p.avatar_url)}">` : `<div class="avatar avatar-fallback" style="width:100%;height:100%;border-radius:16px;">${escapeHtml((p.display_name||'U')[0].toUpperCase())}</div>`}
            <input type="file" accept="image/*" id="avatarInput">
          </div>
          <div style="font-size:13px;color:var(--text-dim);">Tap the tile to change your photo.<br>Square images work best.</div>
        </div>
        <div class="field"><label>${t('displayName')}</label><input id="pDisplayName" value="${escapeHtml(p.display_name||'')}"></div>
        <div class="field"><label>${t('username')}</label><input id="pUsername" value="${escapeHtml(p.username||'')}" pattern="[a-z0-9_]{3,20}"></div>
        <div class="field"><label>${t('bio')}</label><textarea id="pBio" rows="3">${escapeHtml(p.bio||'')}</textarea></div>
        <div class="field-row">
          <div class="field"><label>${t('location')}</label><input id="pLocation" value="${escapeHtml(p.location||'')}"></div>
          <div class="field"><label>${t('website')}</label><input id="pWebsite" value="${escapeHtml(p.website||'')}"></div>
        </div>
        <div class="field"><label>${t('phone')}</label><input id="pPhone" value="${escapeHtml(p.phone||'')}"></div>
        <button class="btn btn-primary" id="saveProfileBtn">${t('save')}</button>
      </div>`;
    document.getElementById('avatarTile').addEventListener('click', ()=>document.getElementById('avatarInput').click());
    document.getElementById('avatarInput').addEventListener('change', async (e)=>{
      const file = e.target.files[0]; if(!file) return;
      try{ const url = await DB.uploadImage('profile-images', file); await DB.saveProfile({avatar_url:url}); State.profile.avatar_url = url; UI.toast(t('saved'),'ok'); Views.renderCustomerView('profile'); }
      catch(err){ UI.toast(err.message,'err'); }
    });
    document.getElementById('saveProfileBtn').addEventListener('click', async ()=>{
      try{
        const fields = {
          display_name: document.getElementById('pDisplayName').value.trim(),
          username: document.getElementById('pUsername').value.trim().toLowerCase(),
          bio: document.getElementById('pBio').value.trim(),
          location: document.getElementById('pLocation').value.trim(),
          website: document.getElementById('pWebsite').value.trim(),
          phone: document.getElementById('pPhone').value.trim(),
        };
        await DB.saveProfile(fields);
        Object.assign(State.profile, fields);
        UI.toast(t('saved'), 'ok');
      }catch(e){ UI.toast(e.message || 'Could not save.', 'err'); }
    });
  },

  async links(c){
    State.links = await DB.myLinks();
    c.innerHTML = `<div style="display:flex;justify-content:flex-end;margin-bottom:16px;"><button class="btn btn-primary" onclick="LinkEditor.open()">${t('addLink')}</button></div><div id="linkList"></div>`;
    Views.renderLinkList();
  },
  renderLinkList(){
    const wrap = document.getElementById('linkList');
    if(!State.links.length){ wrap.innerHTML = `<div class="card empty"><div>${t('noLinksYet')}</div><div style="font-size:13px;margin-top:4px;">${t('noLinksSub')}</div></div>`; return; }
    wrap.innerHTML = State.links.map(l=>`
      <div class="link-row" draggable="true" data-id="${l.id}">
        <span class="handle">⠿</span>
        <div class="info"><div class="t">${escapeHtml(l.title)}</div><div class="u">${escapeHtml(l.url)}</div></div>
        <div class="stats">${l.click_count} clicks</div>
        <div class="row-actions">
          <button class="btn-icon" onclick="LinkEditor.toggleVisible('${l.id}')">${l.visible? '👁' : '🚫'}</button>
          <button class="btn-icon" onclick="LinkEditor.open('${l.id}')">✎</button>
          <button class="btn-icon" onclick="LinkEditor.remove('${l.id}')">🗑</button>
        </div>
      </div>`).join('');
    DragReorder.attach(wrap, '.link-row', async (orderedIds)=>{
      try{ await Promise.all(orderedIds.map((id,idx)=>DB.updateLink(id, {sort_order:idx}))); State.links.sort((a,b)=>orderedIds.indexOf(a.id)-orderedIds.indexOf(b.id)); }
      catch(e){ UI.toast('Could not save order','err'); }
    });
  },

  async social(c){
    const [socials, catalog] = await Promise.all([DB.mySocials(), DB.socialCatalog()]);
    State.socials = socials; State.socialCatalog = catalog;
    c.innerHTML = `<div style="display:flex;justify-content:flex-end;margin-bottom:16px;"><button class="btn btn-primary" onclick="SocialEditor.open()">${t('addSocial')}</button></div><div id="socialList"></div>`;
    Views.renderSocialList();
  },
  renderSocialList(){
    const wrap = document.getElementById('socialList');
    if(!State.socials.length){ wrap.innerHTML = `<div class="card empty">${t('noLinksYet')}</div>`; return; }
    wrap.innerHTML = State.socials.map(s=>{
      const meta = State.socialCatalog.find(p=>p.key===s.platform);
      return `<div class="link-row" draggable="true" data-id="${s.id}">
        <span class="handle">⠿</span>
        <div class="info"><div class="t">${escapeHtml(meta?meta.display_name:s.platform)}</div><div class="u">${escapeHtml(s.url)}</div></div>
        <div class="row-actions">
          <button class="btn-icon" onclick="SocialEditor.toggleVisible('${s.id}')">${s.visible? '👁' : '🚫'}</button>
          <button class="btn-icon" onclick="SocialEditor.open('${s.id}')">✎</button>
          <button class="btn-icon" onclick="SocialEditor.remove('${s.id}')">🗑</button>
        </div>
      </div>`;
    }).join('');
    DragReorder.attach(wrap, '.link-row', async (orderedIds)=>{
      try{ await Promise.all(orderedIds.map((id,idx)=>DB.updateSocial(id, {sort_order:idx}))); }
      catch(e){ UI.toast('Could not save order','err'); }
    });
  },

  async appearance(c){
    const p = State.profile || {};
    c.innerHTML = `
      <div class="card" style="max-width:480px;">
        <div class="field"><label>${t('theme')}</label>
          <select id="apTheme">
            <option value="light" ${p.theme==='light'?'selected':''}>${t('light')}</option>
            <option value="dark" ${p.theme==='dark'?'selected':''}>${t('dark')}</option>
            <option value="system" ${p.theme==='system'?'selected':''}>${t('system')}</option>
          </select>
        </div>
        <div class="field"><label>Accent color</label><input type="color" id="apAccent" value="${p.accent_color||'#B08D57'}" style="height:44px;padding:4px;"></div>
        <button class="btn btn-primary" id="saveAppearance">${t('save')}</button>
      </div>`;
    document.getElementById('saveAppearance').onclick = async ()=>{
      const fields = { theme: document.getElementById('apTheme').value, accent_color: document.getElementById('apAccent').value };
      try{ await DB.saveProfile(fields); Object.assign(State.profile, fields); UI.toast(t('saved'),'ok'); }
      catch(e){ UI.toast(e.message,'err'); }
    };
  },

  async analytics(c, days){
    c.innerHTML = `
      <div class="tabs">${[[7,'last7'],[30,'last30'],[90,'last90'],[0,'allTime']].map(([d,l])=>`<button class="tab ${d===days?'active':''}" onclick="Views.analytics(document.getElementById('content'),${d})">${t(l)}</button>`).join('')}</div>
      <div id="analyticsBody"><div class="skeleton" style="height:160px;border-radius:14px;"></div></div>`;
    const { views, clicks } = await DB.myAnalytics(days || 3650);
    const links = await DB.myLinks();
    const byLinkClicks = {}; clicks.forEach(cl=>{ byLinkClicks[cl.link_id] = (byLinkClicks[cl.link_id]||0)+1; });
    const top = links.map(l=>({title:l.title, n: byLinkClicks[l.id]||0})).sort((a,b)=>b.n-a.n).slice(0,5);
    const dayBuckets = {}; const bucketDays = days && days<=90 ? days : 14;
    for(let i=bucketDays-1;i>=0;i--){ const d=new Date(Date.now()-i*86400000); dayBuckets[d.toISOString().slice(0,10)]=0; }
    views.forEach(v=>{ const k=v.viewed_at.slice(0,10); if(k in dayBuckets) dayBuckets[k]++; });
    const maxV = Math.max(1, ...Object.values(dayBuckets));
    document.getElementById('analyticsBody').innerHTML = `
      <div class="grid grid-2" style="margin-bottom:16px;">
        <div class="card stat"><div class="num">${views.length}</div><div class="lbl">${t('totalViews')}</div></div>
        <div class="card stat"><div class="num">${clicks.length}</div><div class="lbl">${t('totalClicks')}</div></div>
      </div>
      <div class="card" style="margin-bottom:16px;">
        <div style="font-weight:600;margin-bottom:6px;">${t('totalViews')}</div>
        <div class="bar-chart">${Object.values(dayBuckets).map(v=>`<div class="bar" style="height:${Math.max(4,(v/maxV)*100)}%"><span>${v||''}</span></div>`).join('')}</div>
      </div>
      <div class="card">
        <div style="font-weight:600;margin-bottom:10px;">${t('topLinks')}</div>
        ${top.length? top.map(x=>`<div style="display:flex;justify-content:space-between;padding:7px 0;border-bottom:1px solid var(--line);font-size:14px;"><span>${escapeHtml(x.title)}</span><span style="color:var(--text-dim);">${x.n}</span></div>`).join('') : `<div style="color:var(--text-dim);font-size:14px;">No data yet.</div>`}
      </div>`;
  },

  async settings(c){
    const p = State.profile || {};
    c.innerHTML = `
      <div class="card" style="max-width:480px;margin-bottom:16px;">
        <div style="display:flex;justify-content:space-between;align-items:center;">
          <div><div style="font-weight:600;">${t('profileVisibility')}</div><div style="font-size:12.5px;color:var(--text-dim);">Anyone with the link can view your page.</div></div>
          <label class="switch"><input type="checkbox" id="visToggle" ${p.visibility==='public'?'checked':''}><span class="track"></span></label>
        </div>
      </div>
      <div class="card" style="max-width:480px;margin-bottom:16px;">
        <div style="font-weight:600;margin-bottom:10px;">${t('changePassword')}</div>
        <div class="field"><label>${t('newPassword')}</label><input type="password" id="newPass" minlength="8"></div>
        <button class="btn btn-ghost" id="changePassBtn">${t('save')}</button>
      </div>
      <div class="card" style="max-width:480px;border-color:var(--rust);">
        <div style="font-weight:600;margin-bottom:10px;color:var(--rust);">${t('deleteAccount')}</div>
        <div style="font-size:13px;color:var(--text-dim);margin-bottom:12px;">This permanently removes your page, links, and analytics.</div>
        <button class="btn btn-danger" id="delAccountBtn">${t('deleteAccount')}</button>
      </div>`;
    document.getElementById('visToggle').onchange = async (e)=>{
      try{ await DB.saveProfile({visibility: e.target.checked?'public':'private'}); State.profile.visibility = e.target.checked?'public':'private'; UI.toast(t('saved'),'ok'); }
      catch(err){ UI.toast(err.message,'err'); }
    };
    document.getElementById('changePassBtn').onclick = async ()=>{
      const val = document.getElementById('newPass').value;
      if(val.length<8){ UI.toast('Password must be at least 8 characters.','err'); return; }
      try{ await Auth.changePassword(val); UI.toast(t('saved'),'ok'); document.getElementById('newPass').value=''; }
      catch(e){ UI.toast(e.message,'err'); }
    };
    document.getElementById('delAccountBtn').onclick = ()=>{
      UI.confirm(t('confirmDeleteTitle'), t('confirmDeleteBody'), async ()=>{
        try{ await sb.from('la_data').delete().eq('owner_id', State.user.id); await Auth.logout(); }
        catch(e){ UI.toast(e.message,'err'); }
      });
    };
  },
};

/* ================================================================
   LINK / SOCIAL EDITORS
================================================================ */
const LinkEditor = {
  open(id){
    const l = id ? State.links.find(x=>x.id===id) : null;
    UI.openModal(`
      <div class="modal-head"><h3>${l? t('edit') : t('addLink')}</h3><button class="btn-icon" onclick="UI.closeModal()">✕</button></div>
      <div class="field"><label>${t('title')}</label><input id="lfTitle" value="${escapeHtml(l?.title||'')}"></div>
      <div class="field"><label>${t('url')}</label><input id="lfUrl" placeholder="https://" value="${escapeHtml(l?.url||'')}"></div>
      <div class="field"><label>${t('description')}</label><input id="lfDesc" value="${escapeHtml(l?.description||'')}"></div>
      <div class="field-row">
        <div class="field" style="display:flex;align-items:center;gap:8px;padding-top:20px;"><label class="switch"><input type="checkbox" id="lfVisible" ${l? (l.visible?'checked':'') : 'checked'}><span class="track"></span></label><span style="font-size:14px;">${t('visible')}</span></div>
        <div class="field" style="display:flex;align-items:center;gap:8px;padding-top:20px;"><label class="switch"><input type="checkbox" id="lfNewTab" ${l? (l.open_new_tab?'checked':'') : 'checked'}><span class="track"></span></label><span style="font-size:14px;">${t('openNewTab')}</span></div>
      </div>
      <div style="display:flex;gap:10px;justify-content:flex-end;margin-top:6px;">
        <button class="btn btn-ghost" onclick="UI.closeModal()">${t('cancel')}</button>
        <button class="btn btn-primary" id="lfSave">${t('save')}</button>
      </div>`);
    document.getElementById('lfSave').onclick = async ()=>{
      const url = document.getElementById('lfUrl').value.trim();
      if(!/^https?:\/\//i.test(url)){ UI.toast('Enter a valid URL starting with http(s)://','err'); return; }
      const fields = {
        title: document.getElementById('lfTitle').value.trim() || 'Untitled link',
        url, description: document.getElementById('lfDesc').value.trim(),
        visible: document.getElementById('lfVisible').checked,
        open_new_tab: document.getElementById('lfNewTab').checked,
      };
      try{
        if(l){ await DB.updateLink(l.id, fields); Object.assign(l, fields); }
        else{ fields.sort_order = State.links.length; const created = await DB.createLink(fields); State.links.push(created); }
        UI.closeModal(); Views.renderLinkList(); UI.toast(t('saved'),'ok');
      }catch(e){ UI.toast(e.message,'err'); }
    };
  },
  async toggleVisible(id){ const l = State.links.find(x=>x.id===id); const visible = !l.visible; try{ await DB.updateLink(id, {visible}); l.visible = visible; Views.renderLinkList(); }catch(e){ UI.toast(e.message,'err'); } },
  remove(id){ UI.confirm(t('confirmDeleteTitle'), t('confirmDeleteBody'), async ()=>{ try{ await DB.deleteLink(id); State.links = State.links.filter(x=>x.id!==id); Views.renderLinkList(); UI.toast(t('saved'),'ok'); } catch(e){ UI.toast(e.message,'err'); } }); }
};

const SocialEditor = {
  open(id){
    const s = id ? State.socials.find(x=>x.id===id) : null;
    const options = State.socialCatalog.map(p=>`<option value="${p.key}" ${s&&s.platform===p.key?'selected':''}>${escapeHtml(p.display_name)}</option>`).join('');
    UI.openModal(`
      <div class="modal-head"><h3>${s? t('edit') : t('addSocial')}</h3><button class="btn-icon" onclick="UI.closeModal()">✕</button></div>
      <div class="field"><label>Platform</label><select id="sfPlatform">${options}</select></div>
      <div class="field"><label>${t('username')}</label><input id="sfUsername" value="${escapeHtml(s?.username||'')}"></div>
      <div class="field"><label>${t('url')}</label><input id="sfUrl" placeholder="https://" value="${escapeHtml(s?.url||'')}"></div>
      <div style="display:flex;gap:10px;justify-content:flex-end;margin-top:6px;">
        <button class="btn btn-ghost" onclick="UI.closeModal()">${t('cancel')}</button>
        <button class="btn btn-primary" id="sfSave">${t('save')}</button>
      </div>`);
    document.getElementById('sfSave').onclick = async ()=>{
      const url = document.getElementById('sfUrl').value.trim();
      if(!/^https?:\/\/|^mailto:|^tel:/i.test(url)){ UI.toast('Enter a valid URL.','err'); return; }
      const fields = { platform: document.getElementById('sfPlatform').value, username: document.getElementById('sfUsername').value.trim(), url };
      try{
        if(s){ await DB.updateSocial(s.id, fields); Object.assign(s, fields); }
        else{ fields.sort_order = State.socials.length; fields.visible = true; const created = await DB.createSocial(fields); State.socials.push(created); }
        UI.closeModal(); Views.renderSocialList(); UI.toast(t('saved'),'ok');
      }catch(e){ UI.toast(e.message,'err'); }
    };
  },
  async toggleVisible(id){ const s = State.socials.find(x=>x.id===id); const visible = !s.visible; try{ await DB.updateSocial(id, {visible}); s.visible = visible; Views.renderSocialList(); }catch(e){ UI.toast(e.message,'err'); } },
  remove(id){ UI.confirm(t('confirmDeleteTitle'), t('confirmDeleteBody'), async ()=>{ try{ await DB.deleteSocial(id); State.socials = State.socials.filter(x=>x.id!==id); Views.renderSocialList(); UI.toast(t('saved'),'ok'); } catch(e){ UI.toast(e.message,'err'); } }); }
};

/* ================================================================
   DRAG & DROP REORDER
================================================================ */
const DragReorder = {
  attach(container, itemSelector, onDrop){
    let dragEl = null;
    container.querySelectorAll(itemSelector).forEach(item=>{
      item.addEventListener('dragstart', ()=>{ dragEl = item; item.classList.add('dragging'); });
      item.addEventListener('dragend', ()=>{ item.classList.remove('dragging'); onDrop([...container.querySelectorAll(itemSelector)].map(el=>el.dataset.id)); });
      item.addEventListener('dragover', (e)=>{
        e.preventDefault();
        if(!dragEl || dragEl===item) return;
        const rect = item.getBoundingClientRect();
        const after = (e.clientY - rect.top) > rect.height/2;
        container.insertBefore(dragEl, after ? item.nextSibling : item);
      });
    });
  }
};

document.getElementById('modalOverlay').addEventListener('click', (e)=>{ if(e.target.id==='modalOverlay') UI.closeModal(); });

/* ================================================================
   INITIALIZATION — guard: must be logged in AND role = customer
================================================================ */
(async function init(){
  if(!SUPABASE_URL.startsWith('http')){
    document.getElementById('checking').textContent = 'Set SUPABASE_URL and SUPABASE_ANON_KEY at the top of this file.';
    return;
  }
  const { data:{ session } } = await sb.auth.getSession();
  if(!session){ window.location.href = 'login.html'; return; }

  const { data: roleRow } = await sb.from('la_data').select('data').eq('type','user_role').eq('owner_id', session.user.id).maybeSingle();
  if(roleRow && roleRow.data.role === 'master_admin'){ window.location.href = 'master-admin.html'; return; }

  State.user = session.user;
  const { data: profileRow } = await sb.from('la_data').select('data').eq('type','profile').eq('owner_id', session.user.id).maybeSingle();
  const profile = profileRow ? profileRow.data : null;
  if(profile && profile.status === 'disabled'){
    await sb.auth.signOut();
    window.location.href = 'login.html';
    return;
  }
  State.profile = profile;
  if(profile){ State.lang = profile.language || State.lang; if(profile.theme && profile.theme!=='system') State.theme = profile.theme; }

  document.body.setAttribute('data-theme', State.theme);
  document.getElementById('checking').classList.add('hidden');
  document.getElementById('app').classList.add('ready');
  document.getElementById('topbarUser').textContent = session.user.email;
  applyI18n();
  Nav.build();

  try{
    const { data: s } = await sb.from('la_data').select('data').eq('type','platform_settings').eq('key','global').maybeSingle();
    if(s?.data?.platform_name){ document.getElementById('sideBrandName').textContent = s.data.platform_name; document.title = s.data.platform_name + ' — Dashboard'; }
  }catch(e){ /* non-fatal */ }

  sb.auth.onAuthStateChange((event)=>{ if(event === 'SIGNED_OUT') window.location.href = 'login.html'; });

  Views.renderCustomerView('overview');
})();
</script>
