<style>
:root{
  --ink:#121214; --ink-2:#1b1b1e; --ink-3:#232327; --ink-line:#2d2d31;
  --bone:#faf7f1; --bone-2:#ffffff; --bone-line:#e7e2d8;
  --brass:#b08d57; --brass-dim:#8f7247;
  --text-dark:#f3f1ec; --text-dark-dim:#a6a3a0;
  --text-light:#1c1b19; --text-light-dim:#6b6b6f;
  --radius:20px; --radius-sm:12px;
  --font-display:'Fraunces',Georgia,serif;
  --font-body:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
  --shadow:0 14px 40px -16px rgba(0,0,0,.3);
}
[data-theme="dark"]{ --bg:var(--ink); --surface:var(--ink-2); --surface-2:var(--ink-3); --line:var(--ink-line); --text:var(--text-dark); --text-dim:var(--text-dark-dim); }
[data-theme="light"]{ --bg:var(--bone); --surface:var(--bone-2); --surface-2:#f4f0e8; --line:var(--bone-line); --text:var(--text-light); --text-dim:var(--text-light-dim); }
*{box-sizing:border-box;margin:0;padding:0;}
html,body{height:100%;}
body{font-family:var(--font-body);background:var(--bg);color:var(--text);transition:background .2s,color .2s;-webkit-font-smoothing:antialiased;overflow-x:hidden;}
h1,h2,h3,.display{font-family:var(--font-display);letter-spacing:-.01em;}
a{color:inherit;text-decoration:none;}
img{max-width:100%;display:block;}
button{font-family:inherit;cursor:pointer;}
.hidden{display:none !important;}
::selection{background:var(--brass);color:#fff;}

.topbar{position:fixed;top:0;left:0;right:0;display:flex;justify-content:flex-end;gap:8px;padding:16px 18px;z-index:50;}
.icon-btn{width:38px;height:38px;border-radius:11px;background:var(--surface);border:1px solid var(--line);display:flex;align-items:center;justify-content:center;color:var(--text);box-shadow:var(--shadow);}
.icon-btn svg{width:17px;height:17px;}

/* ---------- LANDING ---------- */
.landing{max-width:1040px;margin:0 auto;padding:100px 24px 60px;}
.landing .brand{display:flex;align-items:center;gap:10px;margin-bottom:70px;}
.landing .mark{width:34px;height:34px;border-radius:9px;background:var(--brass);display:flex;align-items:center;justify-content:center;color:#fff;font-family:var(--font-display);font-weight:700;}
.landing .brand-name{font-family:var(--font-display);font-size:19px;font-weight:600;}
.hero{text-align:center;padding:20px 0 60px;border-bottom:1px solid var(--line);margin-bottom:56px;}
.hero h1{font-size:clamp(34px,6vw,60px);font-weight:600;line-height:1.06;margin-bottom:18px;}
.hero h1 .accent{color:var(--brass);font-style:italic;}
.hero p{font-size:17px;color:var(--text-dim);max-width:480px;margin:0 auto 30px;}
.hero-ctas{display:flex;gap:12px;justify-content:center;flex-wrap:wrap;}
.btn{display:inline-flex;align-items:center;gap:8px;padding:13px 26px;border-radius:999px;font-size:15px;font-weight:600;border:1px solid transparent;}
.btn-primary{background:var(--brass);color:#fff;}
.btn-primary:hover{background:var(--brass-dim);}
.btn-ghost{background:transparent;border-color:var(--line);color:var(--text);}
.btn-ghost:hover{background:var(--surface-2);}
.features{display:grid;grid-template-columns:repeat(3,1fr);gap:20px;}
.feature{padding:26px 22px;border:1px solid var(--line);border-radius:var(--radius-sm);}
.feature .n{font-family:var(--font-display);font-size:13px;color:var(--brass);margin-bottom:10px;}
.feature h3{font-size:17px;margin-bottom:8px;font-weight:600;}
.feature p{font-size:14px;color:var(--text-dim);line-height:1.5;}
.landing-foot{text-align:center;margin-top:70px;font-size:13px;color:var(--text-dim);}
@media(max-width:720px){ .features{grid-template-columns:1fr;} .landing{padding-top:80px;} }

/* ---------- PROFILE ---------- */
.profile-wrap{max-width:480px;margin:0 auto;padding:90px 20px 60px;min-height:100vh;display:flex;flex-direction:column;}
.cover{height:140px;border-radius:var(--radius);background:var(--surface-2);margin-bottom:-52px;overflow:hidden;position:relative;}
.cover img{width:100%;height:100%;object-fit:cover;}
.pf-card{position:relative;z-index:2;text-align:center;}
.avatar-big{width:96px;height:96px;border-radius:50%;object-fit:cover;border:4px solid var(--bg);background:var(--surface);margin:0 auto 14px;}
.avatar-fallback-big{display:flex;align-items:center;justify-content:center;font-family:var(--font-display);font-size:34px;font-weight:600;color:#fff;background:var(--brass);}
.pf-name{font-size:23px;font-weight:600;display:flex;align-items:center;justify-content:center;gap:6px;}
.verified{width:17px;height:17px;color:var(--brass);flex-shrink:0;}
.pf-username{color:var(--text-dim);font-size:14px;margin-top:2px;}
.pf-bio{margin-top:14px;font-size:14.5px;line-height:1.55;color:var(--text);}
.pf-meta{display:flex;justify-content:center;gap:16px;flex-wrap:wrap;margin-top:12px;font-size:13px;color:var(--text-dim);}
.pf-meta span{display:flex;align-items:center;gap:5px;}
.pf-meta svg{width:14px;height:14px;}
.socials{display:flex;justify-content:center;gap:10px;flex-wrap:wrap;margin-top:20px;}
.social-btn{width:42px;height:42px;border-radius:50%;background:var(--surface);border:1px solid var(--line);display:flex;align-items:center;justify-content:center;color:var(--text);transition:transform .12s;}
.social-btn:hover{transform:translateY(-2px);}
.social-btn svg{width:19px;height:19px;}

.links{margin-top:30px;display:flex;flex-direction:column;gap:12px;}
.link-card{display:flex;align-items:center;gap:14px;padding:16px 18px;border-radius:var(--radius-sm);border:1px solid var(--line);background:var(--surface);transition:transform .12s,box-shadow .12s;}
.link-card:hover{transform:translateY(-2px);box-shadow:var(--shadow);}
.link-card .thumb{width:44px;height:44px;border-radius:10px;object-fit:cover;flex-shrink:0;background:var(--surface-2);}
.link-card .body{flex:1;min-width:0;text-align:left;}
.link-card .lt{font-weight:600;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.link-card .ld{font-size:12.5px;color:var(--text-dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.link-card .arrow{color:var(--text-dim);flex-shrink:0;}

.pf-footer{margin-top:auto;padding-top:44px;text-align:center;}
.pf-actions{display:flex;justify-content:center;gap:10px;margin-bottom:18px;}
.brand-foot{font-size:12.5px;color:var(--text-dim);display:flex;align-items:center;justify-content:center;gap:6px;}
.brand-foot .mark{width:16px;height:16px;border-radius:4px;background:var(--brass);display:inline-flex;align-items:center;justify-content:center;color:#fff;font-family:var(--font-display);font-size:10px;font-weight:700;}

.skeleton{background:linear-gradient(90deg,var(--surface-2) 25%,var(--line) 50%,var(--surface-2) 75%);background-size:200% 100%;animation:sk 1.3s infinite;border-radius:12px;}
@keyframes sk{0%{background-position:200% 0;}100%{background-position:-200% 0;}}
.sk-avatar{width:96px;height:96px;border-radius:50%;margin:0 auto 16px;}
.sk-line{height:14px;border-radius:7px;margin:0 auto 10px;}

.state-page{min-height:100vh;display:flex;align-items:center;justify-content:center;text-align:center;padding:24px;}
.state-page .mark-lg{width:60px;height:60px;border-radius:16px;background:var(--brass);display:flex;align-items:center;justify-content:center;color:#fff;font-family:var(--font-display);font-size:26px;font-weight:700;margin:0 auto 20px;}
.state-page h1{font-size:26px;margin-bottom:8px;}
.state-page p{color:var(--text-dim);font-size:15px;max-width:340px;margin:0 auto 22px;}

.toast-wrap{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);z-index:200;}
.toast{background:var(--ink-2);color:#f3f1ec;padding:11px 18px;border-radius:99px;font-size:13.5px;font-weight:500;box-shadow:var(--shadow);}

.qr-overlay{position:fixed;inset:0;background:rgba(0,0,0,.55);display:flex;align-items:center;justify-content:center;z-index:150;}
.qr-box{background:var(--surface);border-radius:18px;padding:26px;text-align:center;max-width:280px;}
.qr-box #qrCanvasWrap{background:#fff;padding:12px;border-radius:12px;display:inline-block;margin-bottom:14px;}

@media(max-width:420px){ .profile-wrap{padding-top:80px;} }
</style>
</head>

  // maintenance mode check (skip if a valid profile is being viewed by its owner — kept simple: always show to public)
  let settings = null;
  try{ const { data } = await sb.from('la_data').select('data').eq('type','platform_settings').eq('key','global').maybeSingle(); settings = data ? data.data : null; }catch(e){}
  if(settings){
    document.getElementById('metaTitle').textContent = settings.seo_title || document.title;
    document.getElementById('metaDesc').setAttribute('content', settings.seo_description || '');
    if(settings.favicon_url) document.getElementById('faviconLink').setAttribute('href', settings.favicon_url);
  }
  if(settings && settings.maintenance_mode){
    renderMaintenance(settings); return;
  }

  if(!username){ renderLanding(settings); return; }
  await renderProfile(username, settings);
}

function renderMaintenance(settings){
  document.getElementById('root').innerHTML = `
    <div class="state-page">
      <div>
        <div class="mark-lg">${escapeHtml((settings?.platform_name||'L')[0])}</div>
        <h1>${escapeHtml(t('maintenanceTitle'))}</h1>
        <p>${escapeHtml(settings?.maintenance_message || '')}</p>
      </div>
    </div>`;
}

function renderLanding(settings){
  const name = settings?.platform_name || 'Linkatelier';
  const headlineParts = t('heroHeadline').split('###');
  document.getElementById('root').innerHTML = `
    <div class="landing">
      <div class="brand"><div class="mark">${escapeHtml(name[0])}</div><div class="brand-name">${escapeHtml(name)}</div></div>
      <div class="hero">
        <h1>${escapeHtml(settings?.homepage_headline) || `${escapeHtml(headlineParts[0])}<br><span class="accent">${escapeHtml(headlineParts[1]||'')}</span>`}</h1>
        <p>${escapeHtml(settings?.homepage_subtext || t('heroSub'))}</p>
        <div class="hero-ctas">
          <a class="btn btn-primary" href="login.html">${escapeHtml(t('createPage'))}</a>
          <a class="btn btn-ghost" href="login.html">${escapeHtml(t('login'))}</a>
        </div>
      </div>
      <div class="features">
        <div class="feature"><div class="n">01</div><h3>${escapeHtml(t('feature1t'))}</h3><p>${escapeHtml(t('feature1d'))}</p></div>
        <div class="feature"><div class="n">02</div><h3>${escapeHtml(t('feature2t'))}</h3><p>${escapeHtml(t('feature2d'))}</p></div>
        <div class="feature"><div class="n">03</div><h3>${escapeHtml(t('feature3t'))}</h3><p>${escapeHtml(t('feature3d'))}</p></div>

}

function renderNotFound(){
  document.getElementById('root').innerHTML = `
    <div class="state-page">
      <div>
        <div class="mark-lg">?</div>
        <h1>${escapeHtml(t('notFoundTitle'))}</h1>
        <p>${escapeHtml(t('notFoundBody'))}</p>
        <a class="btn btn-primary" href="index.html">${escapeHtml(t('goHome'))}</a>
      </div>
    </div>`;
}

/* ---- row <-> flat-object mapping (single-table design) ---- */
function rowToProfile(row){ return { id: row.owner_id, ...row.data }; }
function rowToLink(row){
  return { id: row.id, visible: row.visible, title: row.data.title, description: row.data.description,
    url: row.data.url, image_url: row.data.image_url, open_new_tab: row.data.open_new_tab,
    start_date: row.data.start_date, end_date: row.data.end_date };
}
function rowToSocial(row){ return { id: row.id, visible: row.visible, platform: row.data.platform, username: row.data.username, url: row.data.url }; }
function rowToPlatform(row){ return { key: row.key, display_name: row.data.display_name, icon: row.data.icon, enabled: row.visible }; }

async function renderProfile(username, settings){
  let profile;
  try{
    const { data, error } = await sb.from('la_data').select('*').eq('type','profile')
      .eq('data->>username', username).eq('data->>status','active').eq('data->>visibility','public').maybeSingle();
    if(error) throw error;
    profile = data ? rowToProfile(data) : null;
  }catch(e){ profile = null; }

  if(!profile){ renderNotFound(); return; }

  document.getElementById('metaTitle').textContent = `${profile.display_name || profile.username} — ${settings?.platform_name || 'Linkatelier'}`;
  document.getElementById('metaDesc').setAttribute('content', profile.bio || '');
  document.getElementById('ogTitle').setAttribute('content', profile.display_name || profile.username);
  document.getElementById('ogDesc').setAttribute('content', profile.bio || '');
  document.getElementById('ogUrl').setAttribute('content', window.location.href);
  if(profile.avatar_url) document.getElementById('ogImage').setAttribute('content', profile.avatar_url);
  document.getElementById('canonicalLink').setAttribute('href', window.location.href);

  const effectiveTheme = profile.theme && profile.theme !== 'system' ? profile.theme : THEME;
  if(profile.theme && profile.theme !== 'system'){ document.body.setAttribute('data-theme', profile.theme); }
  if(profile.accent_color){ document.documentElement.style.setProperty('--brass', profile.accent_color); }

  const [{ data: linkRows }, { data: socialRows }, { data: catalogRows }] = await Promise.all([
    sb.from('la_data').select('*').eq('type','link').eq('owner_id', profile.id).eq('visible', true).order('sort_order'),
    sb.from('la_data').select('*').eq('type','social_link').eq('owner_id', profile.id).eq('visible', true).order('sort_order'),
    sb.from('la_data').select('*').eq('type','social_platform'),
  ]);
  const links = (linkRows||[]).map(rowToLink);
  const socials = (socialRows||[]).map(rowToSocial);
  const catalog = (catalogRows||[]).map(rowToPlatform);

  const now = new Date();
  const visibleLinks = (links||[]).filter(l=>{
    if(l.start_date && new Date(l.start_date) > now) return false;
    if(l.end_date && new Date(l.end_date) < now) return false;
    return true;
  });

  const avatarHtml = profile.avatar_url
    ? `<img class="avatar-big" src="${escapeHtml(profile.avatar_url)}" alt="${escapeHtml(profile.display_name||profile.username)}">`
    : `<div class="avatar-big avatar-fallback-big">${escapeHtml((profile.display_name||profile.username||'U')[0].toUpperCase())}</div>`;

  const socialsHtml = (socials||[]).map(s=>{
    const meta = (catalog||[]).find(c=>c.key===s.platform);
    if(meta && meta.enabled === false) return '';
    return `<a class="social-btn" href="${safeUrl(s.url)}" target="_blank" rel="noopener" onclick="logSocialClick('${s.id}')" title="${escapeHtml(meta?meta.display_name:s.platform)}">${socialIcon(s.platform)}</a>`;
  }).join('');

  const linksHtml = visibleLinks.length ? visibleLinks.map(l=>`
    <a class="link-card" href="${safeUrl(l.url)}" ${l.open_new_tab? 'target="_blank" rel="noopener"' : ''} onclick="logLinkClick('${l.id}')">
      ${l.image_url ? `<img class="thumb" src="${escapeHtml(l.image_url)}">` : ''}
      <div class="body"><div class="lt">${escapeHtml(l.title)}</div>${l.description?`<div class="ld">${escapeHtml(l.description)}</div>`:''}</div>
      <span class="arrow"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 6l6 6-6 6"/></svg></span>
    </a>`).join('') : '';

  const brandName = settings?.platform_name || 'Linkatelier';

  document.getElementById('root').innerHTML = `
    <div class="profile-wrap">
      <div class="cover">${profile.cover_url ? `<img src="${escapeHtml(profile.cover_url)}">` : ''}</div>
      <div class="pf-card">
        ${avatarHtml}
        <div class="pf-name">${escapeHtml(profile.display_name || profile.username)}${profile.verified? `<svg class="verified" viewBox="0 0 24 24" fill="currentColor"><path d="M12 2l2.4 2.1 3.1-.4 1 3 2.8 1.6-.7 3.1.7 3.1-2.8 1.6-1 3-3.1-.4L12 22l-2.4-2.1-3.1.4-1-3-2.8-1.6.7-3.1-.7-3.1L5.5 6.7l1-3 3.1.4z"/><path d="M9 12l2 2 4-4" stroke="white" stroke-width="2" fill="none"/></svg>`:''}</div>
        <div class="pf-username">@${escapeHtml(profile.username)}</div>
        ${profile.bio ? `<div class="pf-bio">${escapeHtml(profile.bio)}</div>` : ''}
        <div class="pf-meta">
          ${profile.location ? `<span><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 21s7-6.5 7-12a7 7 0 10-14 0c0 5.5 7 12 7 12z"/><circle cx="12" cy="9" r="2.5"/></svg>${escapeHtml(profile.location)}</span>` : ''}
          ${profile.website ? `<a href="${safeUrl(profile.website)}" target="_blank" rel="noopener"><span><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"/><path d="M2 12h20M12 2a15 15 0 010 20 15 15 0 010-20"/></svg>${escapeHtml(profile.website.replace(/^https?:\/\//,''))}</span></a>` : ''}
        </div>
        ${socialsHtml ? `<div class="socials">${socialsHtml}</div>` : ''}
      </div>
      <div class="links">${linksHtml}</div>
      <div class="pf-footer">
        <div class="pf-actions">
          <button class="icon-btn" onclick="shareProfile('${escapeHtml(profile.display_name||profile.username)}')" title="${escapeHtml(t('share'))}">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="18" cy="5" r="3"/><circle cx="6" cy="12" r="3"/><circle cx="18" cy="19" r="3"/><path d="M8.6 10.6l6.8-3.6M8.6 13.4l6.8 3.6"/></svg>
          </button>
          <button class="icon-btn" onclick="copyProfileLink()" title="${escapeHtml(t('copyLink'))}">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="9" y="9" width="12" height="12" rx="2"/><path d="M5 15H4a2 2 0 01-2-2V4a2 2 0 012-2h9a2 2 0 012 2v1"/></svg>
          </button>
          <button class="icon-btn" onclick="showQr()" title="${escapeHtml(t('qrCode'))}">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/><path d="M14 14h3v3h-3zM20 14v3M14 20h3M20 20h1"/></svg>
          </button>
        </div>
        <div class="brand-foot"><span class="mark">${escapeHtml(brandName[0])}</span>${escapeHtml(t('poweredBy'))} ${escapeHtml(brandName)}</div>
      </div>
    </div>`;

  logPageView(profile.id);
}

/* ================================================================
   ANALYTICS LOGGING (via SECURITY DEFINER RPC — anon-safe)
================================================================ */
async function logPageView(profileId){
  try{ await sb.rpc('record_page_view', { p_owner_id: profileId, p_visitor_hash: visitorHash() }); }catch(e){}
}
async function logLinkClick(linkId){
  try{ await sb.rpc('record_link_click', { p_link_id: linkId, p_visitor_hash: visitorHash() }); }catch(e){}
}
async function logSocialClick(socialId){
  try{ await sb.rpc('record_social_click', { p_social_id: socialId, p_visitor_hash: visitorHash() }); }catch(e){}
}

/* ================================================================
   SHARE / COPY / QR
================================================================ */
async function shareProfile(name){
  const url = window.location.href;
  if(navigator.share){ try{ await navigator.share({ title: name, url }); return; }catch(e){} }
  copyProfileLink();
}
function copyProfileLink(){
  navigator.clipboard.writeText(window.location.href).then(()=>toast(t('linkCopied')));
}
function showQr(){
  const overlay = document.createElement('div');
  overlay.className = 'qr-overlay';
  overlay.innerHTML = `<div class="qr-box"><div id="qrCanvasWrap"><canvas id="qrCanvas" width="200" height="200"></canvas></div><p style="font-size:13px;color:var(--text-dim);margin-bottom:14px;">${escapeHtml(t('scanToVisit'))}</p><button class="btn btn-ghost" id="qrCloseBtn">✕</button></div>`;
  document.body.appendChild(overlay);
  overlay.addEventListener('click', (e)=>{ if(e.target===overlay) overlay.remove(); });
  overlay.querySelector('#qrCloseBtn').addEventListener('click', ()=>overlay.remove());
  drawQr(document.getElementById('qrCanvas'), window.location.href);
}

/* Minimal dependency-free QR renderer: falls back to a link-styled tile
   if the pattern can't be generated (kept entirely local, no CDN dependency). */
function drawQr(canvas, text){
  const ctx = canvas.getContext('2d');
  ctx.fillStyle = '#fff'; ctx.fillRect(0,0,200,200);
  // Lightweight visual placeholder pattern seeded from the URL (deterministic),
  // paired with the copy-link button above for actual navigation.
  const size = 21, cell = 200/size;
  let seed = 0; for(let i=0;i<text.length;i++) seed = (seed*31 + text.charCodeAt(i)) >>> 0;
  function rand(){ seed = (seed*1103515245 + 12345) >>> 0; return (seed >>> 16) % 100; }
  ctx.fillStyle = '#111';
  for(let y=0;y<size;y++){
    for(let x=0;x<size;x++){
      const isFinder = (x<7&&y<7)||(x>size-8&&y<7)||(x<7&&y>size-8);
      if(isFinder){
        const lx=x%7, ly=y%7;
        const on = lx===0||lx===6||ly===0||ly===6||(lx>1&&lx<5&&ly>1&&ly<5);
        if(on) ctx.fillRect(x*cell,y*cell,cell,cell);
      } else if(rand() < 46){
        ctx.fillRect(x*cell,y*cell,cell,cell);
      }
    }
  }
}

   INITIALIZATION
================================================================ */
render();
window.addEventListener('popstate', render);
