<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Linkatelier — Log in</title>
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" onerror="this.remove()">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<style>
:root{
  --ink:#121214; --ink-2:#1b1b1e; --ink-3:#232327; --ink-line:#2d2d31;
  --bone:#faf7f1; --bone-2:#ffffff; --bone-line:#e7e2d8;
  --brass:#b08d57; --brass-dim:#8f7247; --rust:#b3432b;
  --text-dark:#f3f1ec; --text-dark-dim:#a6a3a0;
  --text-light:#1c1b19; --text-light-dim:#6b6b6f;
  --font-display:'Fraunces',Georgia,serif;
  --font-body:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
  --shadow:0 10px 30px -12px rgba(0,0,0,.25);
}
[data-theme="dark"]{ --bg:var(--ink); --surface:var(--ink-2); --surface-2:var(--ink-3); --line:var(--ink-line); --text:var(--text-dark); --text-dim:var(--text-dark-dim); }
[data-theme="light"]{ --bg:var(--bone); --surface:var(--bone-2); --surface-2:#f4f0e8; --line:var(--bone-line); --text:var(--text-light); --text-dim:var(--text-light-dim); }
*{box-sizing:border-box;margin:0;padding:0;}
html,body{height:100%;}
body{font-family:var(--font-body);background:var(--bg);color:var(--text);-webkit-font-smoothing:antialiased;}
h2{font-family:var(--font-display);font-weight:600;letter-spacing:-.01em;}
button{font-family:inherit;cursor:pointer;}
input{font-family:inherit;font-size:15px;}
.hidden{display:none !important;}
::selection{background:var(--brass);color:#fff;}

#authScreen{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;position:relative;}
.theme-toggle{position:absolute;top:16px;right:16px;width:38px;height:38px;border-radius:11px;background:var(--surface);border:1px solid var(--line);display:flex;align-items:center;justify-content:center;color:var(--text);}
.theme-toggle svg{width:17px;height:17px;}
.auth-box{width:100%;max-width:400px;}
.brand{display:flex;align-items:center;justify-content:center;gap:10px;padding-bottom:26px;}
.brand .mark{width:30px;height:30px;border-radius:8px;background:var(--brass);display:flex;align-items:center;justify-content:center;color:#fff;font-family:var(--font-display);font-weight:600;font-size:15px;}
.brand .name{font-family:var(--font-display);font-size:18px;font-weight:600;}
.auth-card{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:28px 26px;}
.auth-card h2{font-size:22px;margin-bottom:5px;}
.auth-card .sub{color:var(--text-dim);font-size:14px;margin-bottom:22px;}
.field{margin-bottom:14px;}
.field label{display:block;font-size:13px;font-weight:600;margin-bottom:6px;color:var(--text-dim);}
.field input{width:100%;padding:11px 13px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--text);outline:none;}
.field input:focus{border-color:var(--brass);}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;padding:11px 18px;border-radius:999px;border:none;font-size:14px;font-weight:600;background:var(--brass);color:#fff;width:100%;transition:opacity .15s;}
.btn:hover{background:var(--brass-dim);}
.btn:disabled{opacity:.55;pointer-events:none;}
.auth-switch{text-align:center;margin-top:16px;font-size:13.5px;color:var(--text-dim);}
.auth-switch button{background:none;border:none;color:var(--brass);font-weight:600;font-size:13.5px;}
.auth-error{background:rgba(179,67,43,.1);color:var(--rust);padding:10px 13px;border-radius:10px;font-size:13px;margin-bottom:14px;}
.auth-loading{min-height:100vh;display:flex;align-items:center;justify-content:center;color:var(--text-dim);font-size:14px;}
</style>
</head>
<body data-theme="light">

<div id="checking" class="auth-loading">Checking session…</div>

<div id="authScreen" class="hidden">
  <button class="theme-toggle" id="themeBtn">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
  </button>
  <div class="auth-box">
    <div class="brand"><div class="mark">L</div><div class="name" id="authBrandName">Linkatelier</div></div>

    <div class="auth-card">
      <div id="loginPane">
        <h2>Welcome back</h2>
        <p class="sub">Sign in to manage your page.</p>
        <div id="loginError" class="auth-error hidden"></div>
        <form id="loginForm">
          <div class="field"><label>Email</label><input type="email" id="loginEmail" required autocomplete="email"></div>
          <div class="field"><label>Password</label><input type="password" id="loginPassword" required autocomplete="current-password"></div>
          <button type="submit" class="btn" id="loginBtn">Log in</button>
        </form>
        <div class="auth-switch"><button type="button" onclick="pane('forgotPane')">Forgot password?</button></div>
        <div class="auth-switch"><span>Don't have an account?</span> <button type="button" onclick="pane('signupPane')">Sign up</button></div>
      </div>

      <div id="signupPane" class="hidden">
        <h2>Create your account</h2>
        <p class="sub">Claim your page in seconds.</p>
        <div id="signupError" class="auth-error hidden"></div>
        <form id="signupForm">
          <div class="field"><label>Display name</label><input type="text" id="suDisplayName" required></div>
          <div class="field"><label>Username</label><input type="text" id="suUsername" required pattern="[a-z0-9_]{3,20}" title="3-20 chars: a-z 0-9 _"></div>
          <div class="field"><label>Email</label><input type="email" id="suEmail" required></div>
          <div class="field"><label>Password</label><input type="password" id="suPassword" required minlength="8"></div>
          <div class="field"><label>Confirm password</label><input type="password" id="suConfirm" required minlength="8"></div>
          <button type="submit" class="btn" id="signupBtn">Sign up</button>
        </form>
        <div class="auth-switch"><span>Already have an account?</span> <button type="button" onclick="pane('loginPane')">Log in</button></div>
      </div>

      <div id="forgotPane" class="hidden">
        <h2>Reset password</h2>
        <p class="sub">We'll email you a reset link.</p>
        <div id="forgotError" class="auth-error hidden"></div>
        <form id="forgotForm">
          <div class="field"><label>Email</label><input type="email" id="forgotEmail" required></div>
          <button type="submit" class="btn">Send reset link</button>
        </form>
        <div class="auth-switch"><button type="button" onclick="pane('loginPane')">Back to log in</button></div>
      </div>
    </div>
  </div>
</div>

<script>
/* ================================================================
   CONFIG — replace with your Supabase project values
   (must match the same values used in customer-admin.html,
    master-admin.html, and index.html)
================================================================ */
const SUPABASE_URL = "https://ovzyjnoqnbpwwlqtkwit.supabase.co";
const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im92enlqbm9xbmJwd3dscXRrd2l0Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODA5MzA2MDIsImV4cCI6MjA5NjUwNjYwMn0.UgGC9Bvjeud6v29CjUVrnfRWBuf7jDTxmCOW0u62NRw";

const sb = (SUPABASE_URL.startsWith('http')) ? window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY) : null;

let THEME = localStorage.getItem('la_theme') || 'light';
document.body.setAttribute('data-theme', THEME);
document.getElementById('themeBtn').addEventListener('click', ()=>{
  THEME = THEME === 'dark' ? 'light' : 'dark';
  localStorage.setItem('la_theme', THEME);
  document.body.setAttribute('data-theme', THEME);
});

function pane(id){
  ['loginPane','signupPane','forgotPane'].forEach(p=>document.getElementById(p).classList.toggle('hidden', p!==id));
}

/* ================================================================
   ROLE-BASED REDIRECT
================================================================ */
async function redirectByRole(user){
  const { data: roleRow } = await sb.from('la_data').select('data').eq('type','user_role').eq('owner_id', user.id).maybeSingle();
  const role = roleRow ? roleRow.data.role : 'customer';
  window.location.href = role === 'master_admin' ? 'master-admin.html' : 'customer-admin.html';
}

/* ================================================================
   AUTH ACTIONS
================================================================ */
document.getElementById('loginForm').addEventListener('submit', async (e)=>{
  e.preventDefault();
  const btn = document.getElementById('loginBtn'); btn.disabled = true;
  const err = document.getElementById('loginError'); err.classList.add('hidden');
  try{
    const { data, error } = await sb.auth.signInWithPassword({
      email: document.getElementById('loginEmail').value.trim(),
      password: document.getElementById('loginPassword').value,
    });
    if(error) throw error;
    await redirectByRole(data.user);
  }catch(e2){ err.textContent = e2.message || 'Could not log in.'; err.classList.remove('hidden'); btn.disabled = false; }
});

document.getElementById('signupForm').addEventListener('submit', async (e)=>{
  e.preventDefault();
  const err = document.getElementById('signupError'); err.classList.add('hidden');
  const p1 = document.getElementById('suPassword').value, p2 = document.getElementById('suConfirm').value;
  if(p1 !== p2){ err.textContent = 'Passwords do not match.'; err.classList.remove('hidden'); return; }
  const btn = document.getElementById('signupBtn'); btn.disabled = true;
  try{
    const { data, error } = await sb.auth.signUp({
      email: document.getElementById('suEmail').value.trim(),
      password: p1,
      options:{ data:{ username: document.getElementById('suUsername').value.trim().toLowerCase(), display_name: document.getElementById('suDisplayName').value.trim() } }
    });
    if(error) throw error;
    if(data.user && !data.session){
      err.classList.add('hidden');
      alert('Check your email to confirm your account, then log in.');
      pane('loginPane');
    } else if(data.user){
      await redirectByRole(data.user);
    }
  }catch(e2){ err.textContent = e2.message || 'Could not sign up.'; err.classList.remove('hidden'); }
  finally{ btn.disabled = false; }
});

document.getElementById('forgotForm').addEventListener('submit', async (e)=>{
  e.preventDefault();
  const err = document.getElementById('forgotError'); err.classList.add('hidden');
  try{
    const { error } = await sb.auth.resetPasswordForEmail(document.getElementById('forgotEmail').value.trim(), { redirectTo: window.location.href });
    if(error) throw error;
    alert('Reset link sent — check your email.');
    pane('loginPane');
  }catch(e2){ err.textContent = e2.message || 'Could not send reset link.'; err.classList.remove('hidden'); }
});

/* ================================================================
   INITIALIZATION — if already logged in, skip straight to dashboard
================================================================ */
(async function init(){
  if(!sb){
    document.getElementById('checking').classList.add('hidden');
    document.getElementById('authScreen').classList.remove('hidden');
    document.querySelector('.auth-card').innerHTML = '<h2>Configuration needed</h2><p class="sub">Set SUPABASE_URL and SUPABASE_ANON_KEY at the top of this file.</p>';
    return;
  }
  try{
    const { data: s } = await sb.from('la_data').select('data').eq('type','platform_settings').eq('key','global').maybeSingle();
    if(s?.data?.platform_name){ document.getElementById('authBrandName').textContent = s.data.platform_name; document.title = s.data.platform_name + ' — Log in'; }
  }catch(e){ /* non-fatal */ }

  const { data:{ session } } = await sb.auth.getSession();
  if(session){ await redirectByRole(session.user); return; }
  document.getElementById('checking').classList.add('hidden');
  document.getElementById('authScreen').classList.remove('hidden');
})();
</script>
</body>
</html>
